[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geosqueeze"
version = "1.0.0"
description = "输入 3DGS/点云 → 自动分析 → 剪枝+蒸馏+量化 → 输出可流式加载的 3D Tiles/紧凑格式（含矢量压缩、纹理网格压缩、CesiumJS 查看器、测试工作台）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "duoduohappy" }]
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
las = ["laspy>=2.4"]

[project.scripts]
geosqueeze = "gsq.cli:main"

[tool.setuptools]
packages = ["gsq"]
